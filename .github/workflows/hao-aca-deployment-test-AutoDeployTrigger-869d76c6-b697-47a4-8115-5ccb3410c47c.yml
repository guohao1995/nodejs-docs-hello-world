name: Trigger auto deployment for hao-aca-deployment-test

# When this action will be executed
on:
  # Automatically trigger it when detected changes in repo
  push:
    branches: 
      [ main ]
    paths:
    - '**'
    - '.github/workflows/hao-aca-deployment-test-AutoDeployTrigger-869d76c6-b697-47a4-8115-5ccb3410c47c.yml'

  # Allow manual trigger 
  workflow_dispatch:
      
jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout to the branch
        uses: actions/checkout@v2

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.HAOACADEPLOYMENTTEST_AZURE_CREDENTIALS }}

      - name: Build and push container image to registry
        uses: azure/container-apps-deploy-action@v2
        with:
          appSourcePath: ${{ github.workspace }}
          _dockerfilePathKey_: _dockerfilePath_
          _targetLabelKey_: _targetLabel_
          registryUrl: haoacr.azurecr.io
          registryUsername: ${{ secrets.HAOACADEPLOYMENTTEST_REGISTRY_USERNAME }}
          registryPassword: ${{ secrets.HAOACADEPLOYMENTTEST_REGISTRY_PASSWORD }}
          containerAppName: hao-aca-deployment-test
          resourceGroup: hao-ACA-test
          imageToBuild: haoacr.azurecr.io/hao-aca-deployment-test:${{ github.sha }}
          
            

     

